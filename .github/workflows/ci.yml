name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Builds must not need runtime secrets; none are provided here on purpose.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Migrations match schema
        # Fails if someone changed src/db/schema without committing a generated migration.
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changes are missing a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Unit and integration tests
        # Database tests run against in-process Postgres (PGlite + pgvector); no service container needed.
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  docker:
    name: Docker images and Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway values for the smoke test only.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        # --wait blocks until the app's HEALTHCHECK (/api/health, database included) passes.
        run: docker compose up --build --detach --wait --wait-timeout 180 app worker

      - name: Health endpoint
        run: curl --fail --silent http://localhost:3000/api/health

      - name: Native modules load in the app image
        # onnxruntime-node and sharp are loaded dynamically, so tracing alone could miss them.
        run: docker compose exec -T app node -e "require('onnxruntime-node'); require('sharp'); console.log('native modules ok')"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down --volumes
